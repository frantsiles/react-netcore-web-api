global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: demo-local

scrape_configs:
  # OTel Collector Prometheus exporter (metrics from all .NET services)
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Direct scrape of .NET /metrics endpoints (ASP.NET Core runtime metrics)
  - job_name: demo-api
    static_configs:
      - targets: [api:8080]
        labels:
          service: demo-api
    metrics_path: /metrics

  - job_name: demo-bff
    static_configs:
      - targets: [bff:8080]
        labels:
          service: demo-bff
    metrics_path: /metrics

  - job_name: demo-gateway
    static_configs:
      - targets: [gateway:8080]
        labels:
          service: demo-gateway
    metrics_path: /metrics

  # RabbitMQ Prometheus plugin (needs rabbitmq_prometheus plugin enabled)
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
        labels:
          service: rabbitmq
