apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: demo
  labels:
    app: bff
    app.kubernetes.io/component: bff
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      containers:
        - name: bff
          image: demo/bff:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: demo-secrets
                  key: jwt-secret
            - name: BackendApi__BaseUrl
              value: "http://api:8080/"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.demo-monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: demo-bff
          livenessProbe:
            httpGet:
              path: /bff/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /bff/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
